<div *ngIf="loading" class="muted">Loading album...</div>
<div *ngIf="!loading && errorMsg" class="error">{{ errorMsg }}</div>

<section *ngIf="!loading && album" class="card">
  <h1>Album #{{ album.id }}</h1>
  <p class="muted">User ID: {{ album.userId }}</p>

  <label class="label">Title</label>
  <input class="input" [(ngModel)]="titleDraft" />

  <div class="actions">
    <button
      class="btn"
      (click)="save()"
      [disabled]="saving || titleDraft.trim().length === 0"
    >
      {{ saving ? 'Saving...' : 'Save' }}
    </button>

    <a class="btn ghost" [routerLink]="['/albums', album.id, 'photos']">View Photos</a>
    <button class="btn ghost" (click)="goBack()">Back</button>
  </div>
</section>
